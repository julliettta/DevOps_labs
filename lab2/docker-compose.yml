services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab0
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab0"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backnet]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: lab0
      DB_USER: postgres
      DB_PASSWORD: pass
      INSTANCE_ID: backend-1
    depends_on:
      db:
        condition: service_healthy
    networks: [frontnet, backnet]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [frontnet]

volumes:
  pgdata:

networks:
  frontnet:
  backnet:
